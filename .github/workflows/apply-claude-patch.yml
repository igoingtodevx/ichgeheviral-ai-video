name: Apply Claude Final Polish Source

on:
  push:
    branches:
      - feat/claude-final-polish
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/claude-final-polish
          fetch-depth: 0

      - name: Reconstruct and apply source patch
        shell: bash
        run: |
          cat .claude_patch_chunks/00.txt               .claude_patch_chunks/01.txt               .claude_patch_chunks/02.txt               .claude_patch_chunks/03.txt               .claude_patch_chunks/04.txt               .claude_patch_chunks/05.txt               .claude_patch_chunks/06.txt > /tmp/claude-source.b64
          base64 -d /tmp/claude-source.b64 > /tmp/claude-source.tar.gz
          tar -xzf /tmp/claude-source.tar.gz -C .

          rm -f             src/components/GeneratorShell.tsx             src/components/PhoneMockup.tsx             src/components/RevenueCalculator.tsx             src/components/SocialProofFeed.tsx             src/components/ThemeSwitcher.tsx             src/components/TransformationScrubber.tsx             src/components/ValueComparison.tsx             src/components/VideoShowcase.tsx

          rm -rf .claude_patch_chunks
          rm -f .github/workflows/apply-claude-patch.yml

      - name: Commit applied source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: apply Claude customer-experience rebuild and final polish"
          git push origin HEAD:feat/claude-final-polish

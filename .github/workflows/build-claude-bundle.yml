name: Build Claude Handoff Bundle

on:
  push:
    branches:
      - handoff/claude-masterpiece-20260927
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout handoff branch
        uses: actions/checkout@v4

      - name: Build ZIP
        run: |
          zip -r IGV_CLAUDE_MASTERPIECE_BUNDLE.zip .             -x ".git/*"             -x "node_modules/*"             -x ".next/*"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: IGV_CLAUDE_MASTERPIECE_BUNDLE
          path: IGV_CLAUDE_MASTERPIECE_BUNDLE.zip
          retention-days: 1
